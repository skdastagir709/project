<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BrandName</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #212529;
            --card-bg: #f8f9fa;
            --border-color: #ced4da;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f8f9fa;
            --card-bg: #1e1e1e;
            --border-color: #495057;
            --primary-color: #3d8bfd;
            --primary-hover: #6ea8fe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-weight: bold;
            font-size: 1.25rem;
            text-decoration: none;
            color: var(--text-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-card h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .input-group input {
            padding: 0.7rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        button, .btn {
            cursor: pointer;
            font-size: 1rem;
            border-radius: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            font-weight: bold;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        #themeToggle {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">BrandName</a>
        <div class="nav-actions">
            <button id="themeToggle">Switch Theme</button>
        </div>
    </header>

    <main>
        <div class="form-card">
            <h2>Create Account</h2>
            <form onsubmit="event.preventDefault(); alert('Registration successful!');">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="email">Gmail / Email Address</label>
                    <input type="email" id="email" placeholder="name@gmail.com" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="9876543210" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>
    </main>

    <footer>
        &copy; 2026 BrandName. All rights reserved.
    </footer>

    <script>
        const toggleButton = document.getElementById('themeToggle');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
