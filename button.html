<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - BrandName</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #212529;
            --border-color: #ced4da;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f8f9fa;
            --border-color: #495057;
            --primary-color: #3d8bfd;
            --primary-hover: #6ea8fe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header with side-by-side layout using flexbox */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-weight: bold;
            font-size: 1.25rem;
            text-decoration: none;
            color: var(--text-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem; /* Space between the theme button and register button */
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Top-right theme toggle button styling */
        #themeToggle {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Header with elements aligned side-by-side -->
    <header>
        <a href="index.html" class="logo">BrandName</a>
        <div class="nav-actions">
            <button id="themeToggle">Switch Theme</button>
            <a href="register.html" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Register</a>
        </div>
    </header>

    <main>
        <h1>Welcome to Our Platform</h1>
        <p>The theme switcher button is pinned right at the top header alongside other controls.</p>
        <a href="register.html" class="btn btn-primary">Get Started</a>
    </main>

    <footer>
        &copy; 2026 BrandName. All rights reserved.
    </footer>

    <script>
        const toggleButton = document.getElementById('themeToggle');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
